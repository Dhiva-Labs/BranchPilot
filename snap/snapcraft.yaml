# Snap Store packaging for BranchPilot.
#
# See packaging/SNAP.md for the build and publish procedure.
#
# WHY CLASSIC CONFINEMENT
# =======================
# BranchPilot deliberately owns no credentials: it shells out to the system
# `git` and lets git's own credential helpers and ssh-agent do the
# authenticating. Under *strict* confinement that design cannot work:
#
#   * The `home` interface grants access to non-hidden files only. A repo's
#     nested `.git/` is reachable (its parent path is non-hidden), but the
#     top-level `~/.gitconfig` is not — so git inside the snap would see no
#     user.name/user.email and every commit would fail, and no
#     credential.helper configuration would be visible either.
#   * `~/.ssh` is likewise a top-level hidden directory. The `ssh-keys`
#     interface can grant it, but it is not auto-connected.
#   * The ssh-agent socket under /run/user/<uid> is not exposed by any
#     interface, so agent-based push/pull would fail even with ssh-keys
#     connected.
#   * The user's actual git binary — and any credential helper it invokes,
#     which may live anywhere on PATH — is outside the snap's mount
#     namespace.
#
# Classic confinement is the established fit for developer tooling of this
# shape (the VS Code and JetBrains snaps use it for the same reasons). It
# requires manual review by the Snap Store team; packaging/SNAP.md contains
# the rationale to paste into that request.
name: branchpilot
title: BranchPilot
base: core22
version: '1.0.0'
summary: Git GUI for Linux with a visual commit graph and hunk-level staging
description: |
  BranchPilot is a git client for the Linux desktop: a visual commit graph,
  hunk-level staging, full branch, stash and remote operations, and a
  drag-and-drop editor for interactive rebase.

  It wraps the system git command-line tool directly — there is no libgit2,
  no bundled git binary, and the app never handles or stores credentials.
  Authentication stays exactly where it already lives: your existing git
  credential helpers and ssh-agent.

  Features include a commit graph with persistent lane assignment and
  colour-coded refs, syntax-highlighted diffs with per-hunk staging,
  branch and stash management, fetch/pull/push with live progress,
  interactive rebase with conflict resume, and power operations such as
  tags, cherry-pick, revert, reset, worktrees and per-file history.

  A Dhiva Labs project.

grade: stable
confinement: classic
icon: snap/gui/branchpilot.png
license: MIT
website: https://github.com/Dhiva-Labs/BranchPilot
source-code: https://github.com/Dhiva-Labs/BranchPilot
issues: https://github.com/Dhiva-Labs/BranchPilot/issues
contact: dhivakar1010@gmail.com

architectures:
  - build-on: amd64

apps:
  branchpilot:
    command: bin/branch_pilot
    desktop: usr/share/applications/branchpilot.desktop
    environment:
      # Classic snaps are not given the GTK/GDK plumbing an extension would
      # wire up under strict confinement, so point the toolkit at the
      # libraries and data staged into this snap.
      GDK_BACKEND: ${GDK_BACKEND:-}
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas
      GDK_PIXBUF_MODULE_FILE: $SNAP/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache
      XDG_DATA_DIRS: $SNAP/usr/share:$XDG_DATA_DIRS

parts:
  branchpilot:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    # `source: .` copies the working tree verbatim. A build/ directory left
    # by a host-side `flutter build linux` carries a CMakeCache.txt naming
    # host paths, and CMake refuses to reuse a cache generated elsewhere —
    # the build dies before compiling anything. All of this is regenerated
    # inside the build environment.
    override-pull: |
      craftctl default
      rm -rf build .dart_tool .flutter .pub-cache dist \
        linux/flutter/ephemeral
    # Classic snaps run against their own bundled libraries, which means the
    # ELF interpreter and RPATH of every shipped binary must be rewritten to
    # point inside $SNAP. Without this the app fails to start on any host
    # whose loader path differs.
    build-attributes:
      - enable-patchelf
    # The `flutter` plugin fetches the SDK but does not pull in the GTK
    # toolchain the Linux desktop target compiles against — without these the
    # build dies at "Could NOT find PkgConfig" during CMake configure.
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libjsoncpp-dev
      - curl
      - unzip
      - xz-utils
      - git
    stage-packages:
      - libgtk-3-0
      - libglib2.0-0
      - libgdk-pixbuf-2.0-0
      - librsvg2-common
    organize:
      branch_pilot: bin/branch_pilot

  desktop-assets:
    # Reuse the same launcher entry and icon the Debian package installs
    # rather than maintaining a second copy of either.
    plugin: dump
    source: snap/gui
    organize:
      branchpilot.desktop: usr/share/applications/branchpilot.desktop
      branchpilot.png: usr/share/icons/hicolor/256x256/apps/branchpilot.png
    stage:
      - usr/share/applications/branchpilot.desktop
      - usr/share/icons/hicolor/256x256/apps/branchpilot.png
