# Snap Store packaging for BranchPilot.
#
# Modelled on the SecureShell Go snap in this house: `plugin: flutter` +
# the `gnome` extension under strict confinement, which passes automated
# store review and can be released to a channel immediately.
#
# See packaging/SNAP.md for the build and publish procedure, and for what
# strict confinement costs this particular application.
name: branchpilot
title: BranchPilot
base: core22
version: '1.0.1'
summary: Git GUI for Linux with a visual commit graph and hunk-level staging
description: |
  BranchPilot is a git client for the Linux desktop: a visual commit graph,
  hunk-level staging, full branch, stash and remote operations, and a
  drag-and-drop editor for interactive rebase.

  It wraps the git command-line tool directly — there is no libgit2 and the
  application never handles or stores credentials.

  Features include a commit graph with persistent lane assignment and
  colour-coded refs, syntax-highlighted diffs with per-hunk staging, branch
  and stash management, fetch, pull and push with live progress, interactive
  rebase with conflict resume, and power operations such as tags,
  cherry-pick, revert, reset, worktrees and per-file history.

  Note on confinement: as a strictly confined snap this build reads your SSH
  keys through the ssh-keys interface, which must be connected once after
  install:

    sudo snap connect branchpilot:ssh-keys

  Your top-level ~/.gitconfig is not visible to a confined snap, so set your
  identity per repository (git config user.name / user.email) or use the
  commit box, which writes repository-local configuration.

  A Dhiva Labs project.

grade: stable
confinement: strict
icon: snap/gui/branchpilot.png
license: MIT
website: https://github.com/Dhiva-Labs/BranchPilot
source-code: https://github.com/Dhiva-Labs/BranchPilot
issues: https://github.com/Dhiva-Labs/BranchPilot/issues
contact: dhivakar1010@gmail.com

architectures:
  - build-on: [amd64]
  - build-on: [arm64]

apps:
  branchpilot:
    command: branch_pilot
    # The `gnome` extension is the core22 replacement for separate
    # desktop/gtk plumbing: it supplies the GTK3/GLib/Wayland/X11 platform
    # via a content snap, the `desktop-launch` command-chain wrapper, and
    # font/theme/icon handling. It also injects the desktop, desktop-legacy,
    # gsettings, opengl, wayland and x11 plugs automatically; the ones
    # repeated below are for readability — snapcraft de-duplicates them.
    extensions:
      - gnome
    desktop: usr/share/applications/branchpilot.desktop
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - gsettings
      # Repositories are reached through `home`, which covers a nested
      # .git/ directory because its parent path is not hidden. The user's
      # top-level ~/.ssh is hidden and needs this interface instead; it is
      # not auto-connected, so `snap connect branchpilot:ssh-keys` is
      # required once for SSH remotes (documented in the description and
      # the README).
      - ssh-keys

parts:
  branchpilot:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    # `source: .` copies the working tree verbatim. A build/ directory left
    # by a host-side `flutter build linux` carries a CMakeCache.txt naming
    # host paths, and CMake refuses to reuse a cache generated elsewhere —
    # the build dies before compiling anything.
    override-pull: |
      craftctl default
      rm -rf build .dart_tool .flutter .pub-cache dist parts prime stage \
        linux/flutter/ephemeral
    # The `flutter` plugin fetches the SDK but does not pull in the GTK
    # toolchain the Linux desktop target compiles against — without these
    # the build fails at "Could NOT find PkgConfig" during CMake configure.
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libjsoncpp-dev
      - curl
      - unzip
      - xz-utils
      - git
    stage-packages:
      - libgtk-3-0
      # BranchPilot shells out to git for every operation and bundles no git
      # logic of its own. A confined snap cannot execute the host's binary,
      # so git ships inside the snap; GitCli falls back from /usr/bin/git to
      # the first `git` on PATH, which resolves to this one.
      - git
      # git's own helpers: ssh for SSH remotes, ca-certificates so HTTPS
      # remotes verify, and less because git invokes a pager by default
      # (BranchPilot passes --no-pager, but git's own error paths do not).
      - openssh-client
      - ca-certificates
      - less

  desktop-assets:
    # Reuse the same launcher entry and icon the Debian package installs
    # rather than maintaining a second copy of either.
    plugin: dump
    source: snap/gui
    organize:
      branchpilot.desktop: usr/share/applications/branchpilot.desktop
      branchpilot.png: usr/share/icons/hicolor/256x256/apps/branchpilot.png
    stage:
      - usr/share/applications/branchpilot.desktop
      - usr/share/icons/hicolor/256x256/apps/branchpilot.png
