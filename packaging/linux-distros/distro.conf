# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (packaging/build_deb.sh).

NAME=branchpilot
APP_NAME=BranchPilot
GITHUB_REPO=Dhiva-Labs/BranchPilot
TAG_PREFIX=v
SUMMARY='GitKraken-class git GUI for Linux, wrapping the system git CLI'
DESCRIPTION='BranchPilot is a desktop git client for Linux built around the system git command-line tool: no libgit2, no native git bindings, and authentication stays entirely with your existing git credential helpers and ssh-agent. It shows a lane-based commit graph with merge/fork edges and colour-coded branch/tag/remote decorations, hunk-level diff staging with syntax highlighting, a commit/amend box, full branch and stash management, merge conflict resolution, fetch/pull/push with live streaming progress, a visual interactive rebase (reorder/reword/squash/fixup/drop, with conflict pause/resume), tags, cherry-pick, revert, a typed-confirmation gated hard reset, worktrees, and per-file history.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/BranchPilot
LICENSE=MIT
LICENSE_FILE=LICENSE

# BranchPilot runs the system git for every operation (lib/git/git_cli.dart
# prefers /usr/bin/git), so git is a hard dependency on every distribution.
RPM_REQUIRES=(/usr/bin/git)
ARCH_DEPENDS=(gtk3 git)
ARCH_INDEPENDENT=0

# AppImage: it runs the host's git, like the .deb.
APPIMAGE=1
EXEC=usr/lib/branchpilot/branch_pilot
DESKTOP=usr/share/applications/branchpilot.desktop
ICON=usr/share/icons/hicolor/256x256/apps/branchpilot.png
APPRUN_ENV=''

# Smoke test run in each distribution container by verify.sh: smoke.sh starts
# GUI_CMD on a fresh git repository and passes once the Flutter UI has
# painted and the app has run git on that repository (see smoke.sh).
GUI_CMD=branchpilot
SMOKE_SECONDS=120
SMOKE_CMD=''
